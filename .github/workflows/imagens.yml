# Publica as imagens das calculadoras da Receita (amd64 + arm64) no GHCR.
name: Imagens das calculadoras
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['infra/receita/**', '.gitmodules']
permissions: { contents: read, packages: write }
jobs:
  publicar:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - { alvo: regime-geral, nome: notaleve-calc-regime-geral, tag: '1.6.1' }
          - { alvo: simples-nacional, nome: notaleve-calc-simples-nacional, tag: '0.0.6' }
    steps:
      - uses: actions/checkout@v4
        with: { submodules: recursive }
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with: { registry: ghcr.io, username: '${{ github.actor }}', password: '${{ secrets.GITHUB_TOKEN }}' }
      - uses: docker/build-push-action@v6
        with:
          context: infra/receita
          file: infra/receita/Dockerfile.java
          target: ${{ matrix.alvo }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/${{ matrix.nome }}:${{ matrix.tag }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
